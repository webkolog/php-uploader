name: W-PHP Uploader CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    name: PHP ${{ matrix.php-versions }} Core Verification
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['7.4', '8.0', '8.1', '8.2']

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, gd, fileinfo
        coverage: none

    - name: Check PHP Syntax (Lint)
      run: |
        php -l uploader.php
        php -l image-uploader.php
